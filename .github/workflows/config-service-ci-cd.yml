name: CI/CD Pipeline

on:
  push:
    branches: [main, Team3]
  pull_request:
    branches: [main, Team3]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Lint source code
        run: npx eslint src/ --no-eslintrc --env node,es2021 --parser-options=ecmaVersion:2021

  test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config-service
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: config_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      kafka:
        image: bitnami/kafka:latest
        env:
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Run coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: config-service/tests/coverage

  docker-build-push:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Team3'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
      - name: Build and push image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/config-service:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/config-service:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/config-service:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/config-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/config-service:latest

  deploy:
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config-service
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/config-service config-service=ghcr.io/${{ github.repository_owner }}/config-service:${{ github.sha }} -n cse474-prod
          kubectl rollout status deployment/config-service -n cse474-prod
      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/config-service -n cse474-prod
