name: CI/CD

on:
  push:
    branches: [main, Team3]
  pull_request:
    branches: [main, Team3]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Lint source code
        run: npx eslint src/

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: flags_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: bitnami/kafka:latest
        env:
          ALLOW_PLAINTEXT_LISTENER: 'yes'
          KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CFG_PROCESS_ROLES: broker,controller
          KAFKA_CFG_NODE_ID: '1'
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: flags_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          KAFKA_BROKER: localhost:9092
          KAFKA_CLIENT_ID: feature-flag-service
          KAFKA_TOPIC: flag.updated
          JAEGER_ENDPOINT: http://jaeger:14268/api/traces
        run: npm test
      - name: Run coverage
        run: npm run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/coverage

  docker-build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/feature-flag-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/feature-flag-service:latest

  deploy:
    needs: docker-build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Set kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          mkdir -p ~/.kube
          mv kubeconfig ~/.kube/config
      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/ -n cse474-prod
      - name: Update deployment image
        run: |
          kubectl set image deployment/feature-flag-service feature-flag-service=ghcr.io/${{ github.repository_owner }}/feature-flag-service:${{ github.sha }} -n cse474-prod
          kubectl rollout status deployment/feature-flag-service -n cse474-prod
      - name: Rollback on failure
        if: failure()
        run: kubectl rollout undo deployment/feature-flag-service -n cse474-prod
